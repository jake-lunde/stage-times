# The watch list: the festivals whose official schedule pages the watcher polls
# (src/watcher.ts, hourly from .github/workflows/watch.yml). One entry per
# edition; adding a festival is adding an entry. Every field but `slug` and
# `match` is required — it is what the machine cannot know.
#
#   festival   display name; becomes the edition's name
#   slug       permanent URL slug; derived from the name when omitted
#   year
#   source     the schedule page — where the set-times images will appear
#   timezone   IANA zone the times are printed in
#   dates      first and last festival day; polling stops after the last
#   window     the drop window: hourly polls from `from` through `to` (default:
#              the last day); daily before it
#   match      a regular expression on the image URL; only matching images are read
#   subreddit  the festival's subreddit, as in r/<name>; during the drop window the
#              signal (src/signal.ts) sends a link to any set-times post on it that
#              gains votes. Optional; an entry without one is not signalled.
#
# A drop opens a review pull request; merging it publishes and lists the edition
# at stagetimes.app/<slug>-<year>/ the way the owner's own confirm would.
# Procedure: docs/watcher-runbook.md.

- festival: Austin City Limits
  year: 2026
  source: https://www.aclfestival.com/schedule
  timezone: America/Chicago
  dates: { first: 2026-10-02, last: 2026-10-11 }
  window: { from: 2026-08-14 }
  # Both weekends are one edition (ADR-0004): six schedule images, Wk1 and Wk2,
  # among some forty others on the page. The stage ids and names are the
  # owner's (`read_as` in the edition), so a new reading keeps them.
  match: ACL26-Schedule


# The almanac: what is on record about the big festivals, for the monthly
# look-ahead (src/look-ahead.ts, from .github/workflows/look-ahead.yml). On the
# 1st of each month the owner gets one issue listing every edition here whose
# first day falls in the next ninety days, with the watch-list entry to add
# for any edition config/watch.yaml does not have yet.
#
#   festival   display name; the watch entry's name
#   slug       the watch entry's slug — permanent once published; derived from
#              the name when omitted
#   source     the page to watch: the schedule page, or the lineup page until
#              one exists
#   timezone   IANA zone the times are printed in
#   form       where the set times appear: poster (images on the site — the
#              only form the watcher reads), web (text on the site), app,
#              social, or unknown
#   match      carried into the watch entry (a regular expression on the image URL)
#   subreddit  carried into the watch entry, for the signal
#   editions   one per year on record: dates { first, last }, and once the set
#              times are out, dropped: the day they were first posted. The
#              look-ahead expects this year's drop at last year's lead.
#
# Nothing here is guessed. A date nobody has checked stays out: an edition
# without `dropped` says "No earlier drop on record", and a festival whose
# next year is missing is listed as "Not on record" when last year's days
# come round. Add next year's days when they are announced; add `dropped` the
# day the set times appear.
#
# Source for the 2026 entries: the self-serve editions spec (2026-09-06
# survey) and config/watch.yaml.

- festival: Austin City Limits
  source: https://www.aclfestival.com/schedule
  timezone: America/Chicago
  form: poster
  # Two weekends, one edition (ADR-0004). The schedule images carry the year
  # (ACL26-Schedule-…), so the watch entry's match is set per year.
  editions:
    - year: 2026
      dates: { first: 2026-10-02, last: 2026-10-11 }

- festival: III Points
  slug: iii-points
  source: https://www.iiipoints.com/lineup-2026/
  timezone: America/New_York
  form: unknown
  subreddit: IIIPoints
  editions:
    - year: 2026
      dates: { first: 2026-10-16, last: 2026-10-17 }

- festival: EDC Orlando
  # Checked 2026-09-21: the page gives November 6-8, 2026, and promises set
  # times to sign-ups; the old orlando.electricdaisycarnival.com redirects here.
  source: https://orlando.edc.com/
  timezone: America/New_York
  form: app
  subreddit: EDCOrlando
  editions:
    - year: 2026
      dates: { first: 2026-11-06, last: 2026-11-08 }

- festival: Camp Flog Gnaw
  source: https://www.campfloggnaw.com/lineup
  timezone: America/Los_Angeles
  form: unknown
  subreddit: CampFlogGnaw
  editions:
    - year: 2026
      dates: { first: 2026-11-14, last: 2026-11-15 }

- festival: Corona Capital
  # Checked 2026-09-21: the page answers, but its text does not give the 2026
  # dates (they may be in an image); the dates below are the spec's.
  source: https://www.coronacapital.com.mx/
  timezone: America/Mexico_City
  form: unknown
  subreddit: coronacapital
  editions:
    - year: 2026
      dates: { first: 2026-11-20, last: 2026-11-22 }

- festival: Portola
  source: https://portolamusicfestival.com/set-times
  timezone: America/Los_Angeles
  form: poster
  match: SetTimes
  editions:
    - year: 2026
      dates: { first: 2026-09-26, last: 2026-09-27 }
      # The Sunday set-times image was uploaded 2026-08-27 (its Last-Modified);
      # the Saturday one was revised 2026-09-21.
      dropped: 2026-08-27

- festival: Oceans Calling
  source: https://oceanscallingfestival.com/schedule
  timezone: America/New_York
  form: poster
  match: OC26_Schedules
  editions:
    - year: 2026
      dates: { first: 2026-09-25, last: 2026-09-27 }
      # The Friday schedule image was uploaded 2026-09-11 (its Last-Modified);
      # Saturday's and Sunday's followed on 2026-09-17.
      dropped: 2026-09-11

- festival: Ohana Festival
  slug: ohana
  source: https://ohanafest.com/schedule
  timezone: America/Los_Angeles
  form: poster
  match: SetTimes
  editions:
    - year: 2026
      dates: { first: 2026-09-25, last: 2026-09-27 }
      # The Saturday set-times image was uploaded 2026-08-17 (its Last-Modified);
      # Sunday's 2026-08-21, and Friday's was replaced 2026-09-16.
      dropped: 2026-08-17

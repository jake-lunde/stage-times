# FIXTURE DATA — Harbor Lights Festival is not a real festival.
#
# This file exists so the pipeline and pages can be built and reviewed before real
# lineup screenshots are ingested. It is also the golden-file fixture for the test
# suite. It deliberately contains every edge case Phase 1 ingest will hit:
#
#   - post-midnight sets resolved to the following calendar date (see `# shifted` comments)
#   - inferred end times (end_inferred: true)
#   - stylized artist casing that must survive normalization (SOPHIE, black midi)
#   - non-ASCII artist names (folding + escaping test)
#   - artist names containing commas and ampersands (escaping test)
#   - a very long artist name (75-octet line folding test)
#   - a stage renamed since a previous year, proving id != name
#
# DO NOT publish this to the production apex.

festival:
  name: "Harbor Lights Festival"
  slug: "harbor-lights"
  year: 2026
  timezone: "America/Chicago"
  official_url: "https://example.com/harbor-lights/schedule"

stages:
  - id: "main"
    name: "Lakefront Main Stage"      # renamed from "Main Stage" — id stays `main` forever
    description: "The big one. Headliners each night."
  - id: "grove"
    name: "The Grove"
    description: "Trees, shade, quieter bills."
  - id: "warehouse"
    name: "Warehouse"
    description: "Dark room, loud system, runs latest."
  - id: "canal"
    name: "Canal Stage"
    description: "Waterside. Sound carries."
  - id: "porch"
    name: "The Porch"
    description: "Acoustic and spoken word. Afternoons only."
  - id: "annex"

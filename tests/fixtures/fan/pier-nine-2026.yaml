# FIXTURE DATA — Pier Nine is not a real festival and must never be published.
#
# The fan-namespace fixture. It exists so the build can be shown producing an
# owner edition and a fan edition side by side: this one lands under
# /fan/pier-nine-2026/ while harbor-lights-2026 lands at the root. The same
# fixture is also the one the tests block, so it stays small and its stage
# names are distinctive enough to assert on in an empty calendar's name.
#
# The file sits under tests/fixtures/fan/ by convention only — the namespace
# is declared by the `namespace:` field below, not by the directory.

verified: true

namespace: fan

festival:
  name: "Pier Nine"
  slug: "pier-nine"
  year: 2026
  timezone: "America/New_York"
  official_url: "https://example.com/pier-nine/set-times"


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Schedule | Low Tide 2026</title>
  <meta property="og:image" content="https://cdn.example.net/share/low-tide-og.jpg">
  <link rel="icon" href="/favicon.png">
  <style>.hero { background-image: url("/img/hero-bg.jpg"); }</style>
</head>
<body>
  <header>
    <a href="/"><img src="/img/logo.png" alt="Low Tide" width="200" height="60"></a>
  </header>
  <main>
    <div class="tabs">
      <button>Friday</button><button>Saturday</button>
    </div>
    <div class="day" data-day="friday">
      <a href="https://cdn.example.net/files/friday-full.png">
        <img src="https://cdn.example.net/files/friday-800.png"
             srcset="https://cdn.example.net/files/friday-500.png 500w, https://cdn.example.net/files/friday-1600.png 1600w, https://cdn.example.net/files/friday-800.png 800w"
             sizes="100vw" alt="Friday schedule">
      </a>
    </div>
    <div class="day" data-day="saturday">
      <img data-src="https://cdn.example.net/files/saturday.webp" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Saturday schedule" loading="lazy">
    </div>
    <picture>
      <source srcset="https://cdn.example.net/files/sponsor-2x.jpg 2x, https://cdn.example.net/files/sponsor.jpg 1x" type="image/jpeg">
      <img src="https://cdn.example.net/files/sponsor.jpg" alt="Presented by">
    </picture>
    <img src="/img/logo.png" alt="Low Tide again">
    <a href="/tickets">Tickets</a>
  </main>
</body>
</html>

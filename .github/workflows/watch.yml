# The watcher's schedule (src/watcher.ts). This runs hourly; which entries are
# polled on a given run is the cadence in config/watch.yaml — hourly inside an
# entry's drop window, daily (the 15:00 UTC run) before it, never after the
# festival. No server is kept alive: a run reads the pages, and on a drop or a
# change commits the reply and the watcher's state to main and opens a review
# pull request for the owner to merge from his phone.
#
# Secrets: ANTHROPIC_API_KEY (a repository secret, set by
# scripts/provision-secrets.sh) pays for the two model calls; GITHUB_TOKEN is
# the workflow's own, with the write permissions below.

name: Watch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Poll every entry now, whatever the cadence says
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run watch -- ${{ inputs.force && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

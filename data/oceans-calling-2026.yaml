namespace: owner

festival:
  name: "Oceans Calling"
  slug: "oceans-calling"     # PERMANENT — appears in every subscription URL
  year: 2026
  timezone: "America/New_York"
  official_url: "https://oceanscallingfestival.com/schedule"   # from the poster — unverified

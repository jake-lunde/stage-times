verified: true

# PERMANENT — decides the URL family: owner editions live at /<slug>-<year>/, fan editions at
# /fan/<slug>-<year>/ (docs/adr/0001-fan-namespace-prefix.md). Never changes after first publish.
namespace: owner

festival:
  name: "Portola"
  slug: "portola"     # PERMANENT — appears in every subscription URL
  year: 2026
  timezone: "America/Los_Angeles"
  official_url: "https://portolamusicfestival.com/set-times"   # from the poster — unverified
  city: "San Francisco"                      # display only (the homepage card); never in a feed
  # The festival's own colors, off its art: one per stage, in the order a weekend lists them.
  # Each stage card and each stage calendar's color. Absent or short means the house colors.
  # Pier, Crane, Warehouse and Ship Tent are the grounds of their own stage posters on the
  # set-times page; Despacio, which has none, takes the Sunday poster's paper.
  colors: ["#2D4291", "#DD6B35", "#DEB935", "#2F5428", "#DFDADE"]

stages:
  - id: "pier"     # PERMANENT url slug — never change after publish
    name: "Pier Stage"
  - id: "crane"     # PERMANENT url slug — never change after publish
    name: "Crane Stage"
  - id: "warehouse"     # PERMANENT url slug — never change after publish
    name: "Warehouse"
  - id: "ship-tent"     # PERMANENT url slug — never change after publish
    name: "Ship Tent"
    read_as: "shiptent"     # the id a new reading of the source derives; maps it back here
  - id: "despacio"     # PERMANENT url slug — never change after publish
    name: "Despacio"


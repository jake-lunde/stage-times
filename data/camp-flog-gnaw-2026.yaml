verified: true

# PERMANENT — decides the URL family: owner editions live at /<slug>-<year>/, fan editions at
# /fan/<slug>-<year>/ (docs/adr/0001-fan-namespace-prefix.md). Never changes after first publish.
namespace: owner

festival:
  name: "Camp Flog Gnaw"
  slug: "camp-flog-gnaw"     # PERMANENT — appears in every subscription URL
  year: 2026
  timezone: "America/Los_Angeles"
  official_url: "https://www.campfloggnaw.com/set-times"   # fetched 2026-11-13
  city: "Los Angeles"                      # display only (the homepage card); never in a feed
  # The festival's own colors, off its art: one per stage, in the order a weekend lists them.
  # Each stage card and each stage calendar's color. Absent or short means the house colors.
  # Camp, Flog and Gnaw are the three column colors of the set-times posters.
  colors: ["#EEE5C4", "#F6B87B", "#B3DFEA"]

stages:
  - id: "camp"     # PERMANENT url slug — never change after publish
    name: "Camp Stage"
  - id: "flog"     # PERMANENT url slug — never change after publish
    name: "Flog Stage"
  - id: "gnaw"     # PERMANENT url slug — never change after publish
    name: "Gnaw Stage"


#
# verified: true — every set checked against the source image above, then checked
# again by a second reader. Corrections made on review are listed in the
# TRANSCRIPTION log next to this file.

verified: true

# PERMANENT — decides the URL family: owner editions live at /<slug>-<year>/, fan editions at
# /fan/<slug>-<year>/ (docs/adr/0001-fan-namespace-prefix.md). Never changes after first publish.
namespace: owner

festival:
  name: "Corona Capital"
  slug: "corona-capital"     # PERMANENT — appears in every subscription URL
  year: 2026
  timezone: "America/Mexico_City"
  official_url: "https://www.instagram.com/coronacapital/"   # set times posted 2026-11-12; fetched 2026-11-13
  city: "Mexico City"                      # display only (the homepage card); never in a feed
  # The festival's own colors, off its art: one per stage, in the order a weekend lists them.
  # Each stage card and each stage calendar's color. Absent or short means the house colors.
  # The day posters print only three column inks for five stages: navy (Corona, Corona Cero),
  # lime (Doritos, Viva Tent) and blue (NIVEA). Corona, Doritos and NIVEA keep their poster
  # ink; Corona Cero and Viva Tent take the two other blues of the festival's own art.
  colors: ["#002357", "#E9FE19", "#043989", "#0B61EA", "#0849B0"]

stages:
  - id: "corona"     # PERMANENT url slug — never change after publish
    name: "Corona"
  - id: "doritos"     # PERMANENT url slug — never change after publish
    name: "Doritos"
  - id: "corona-cero"     # PERMANENT url slug — never change after publish
    name: "Corona Cero"
  - id: "nivea"     # PERMANENT url slug — never change after publish
    name: "NIVEA"
  - id: "viva-tent"     # PERMANENT url slug — never change after publish
    name: "Viva Tent"


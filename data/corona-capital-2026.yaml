# Source images:
#   bd37bd02638d4c458417947ce9e95bfab89c5d2fb4dbd3893f2209e68e76e0c9.jpg
#   c51602927b7d7c08e7c525f4a1fa1ffc546670cd5529f6e55db83ffdedd85a11.jpg
